pgn: 130821
id: fusionRemoteFirmwareBlock
description: 'Fusion: Remote Firmware Block'
type: Fast
priority: 7
variantOrder: 5
missing:
- Resolution
fields:
- id: manufacturerCode
  name: Manufacturer Code
  type: LOOKUP
  bits: 11
  match: 419
  lookup: MANUFACTURER_CODE
  primaryKey: true
- id: reserved
  name: Reserved
  type: RESERVED
  bits: 2
- id: industryCode
  name: Industry Code
  type: LOOKUP
  bits: 3
  match: 4
  lookup: INDUSTRY_CODE
  primaryKey: true
- id: firmwareVersion
  name: Firmware Version
  type: UINT32
  description: Raw little-endian version word; the captured NRX300 1.02.78 image uses 10278. Encoding
    for other versions or devices is not established.
  specialValues: 0
- id: imageCrc
  name: Image CRC
  type: UINT16
  description: CRC of the complete firmware image, not just this block. Little-endian; reflected polynomial
    0x8408, initial 0xffff, no final XOR in the captured transfer.
  specialValues: 0
- id: blockCount
  name: Block Count
  type: UINT16
  description: Total number of blocks advertised by the sender; 1022 in the captured transfer. Do not
    derive this field from a presumed image-size formula.
  specialValues: 0
- id: blockIndex
  name: Block Index
  type: UINT16
  description: Zero-based block index, from 0 through 1021 in the captured transfer.
  specialValues: 0
- id: byteOffset
  name: Byte Offset
  type: UINT32
  description: Offset of the first data byte within the complete firmware image.
  specialValues: 0
- id: dataLength
  name: Data Length
  type: UINT16
  description: 'Number of following data bytes: 128 in the captured full blocks and 60 in the final block.
    Excludes fast-packet framing and padding.'
  specialValues: 0
- repeat:
    countField: dataLength
    fields:
    - id: dataByte
      name: Data Byte
      type: BINARY
      bits: 8
notes: |-
  Transfers firmware image blocks from the stereo to an MS-NRX300 remote.
  Unlike the Fusion update command/status PGNs, there is no separate message
  ID after the manufacturer/industry prefix. The header is 18 bytes and the
  reassembled payload length is 18 plus Data Length.

  The MS-RA70N/MS-NRX300 capture contains 1022 consecutive blocks, indexes
  0 through 1021, with byte offsets increasing by 128. The first 1021 blocks
  contain 128 data bytes each; the final block contains 60. Reassembly yields
  130748 bytes, version word 10278 and image CRC 0x4ef0. The whole-image CRC
  was independently recomputed from the captured bytes. The version word is
  kept numeric rather than assuming a general version-string encoding.

  Data bytes repeat Data Length times. CAN fast-packet headers and padding
  are not firmware data. Header integers are retained as raw unsigned values
  without assumed NMEA numeric sentinels. Other image sizes, version encodings
  and model-specific boundary behavior are not established by this capture.
  Decoding a block does not verify the complete image or prove installation
  or subsequent boot success.

  The associated update request is PGN 126720 command 0x0010, target 2;
  progress/state is PGN 130820 message 0x8016. Evidence:
  samples/fusion-firmware-transfer.raw, first/middle/final blocks from
  fusion-nrx300-updatenrx.log (2026-09-19).
