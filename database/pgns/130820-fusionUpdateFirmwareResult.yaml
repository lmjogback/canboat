pgn: 130820
id: fusionUpdateFirmwareResult
description: 'Fusion: Update Firmware Result'
type: Fast
priority: 7
variantOrder: 72
fields:
- id: manufacturerCode
  name: Manufacturer Code
  type: LOOKUP
  bits: 11
  description: Fusion Electronics
  match: 419
  lookup: MANUFACTURER_CODE
- id: reserved
  name: Reserved
  type: RESERVED
  bits: 2
- id: industryCode
  name: Industry Code
  type: LOOKUP
  bits: 3
  description: Marine Industry
  match: 4
  lookup: INDUSTRY_CODE
- id: messageId
  name: Message ID
  type: LOOKUP
  bits: 16
  description: Update Firmware Result
  match: 32790
  lookup: FUSION_STATUS_MESSAGE_ID
  primaryKey: true
- id: updateTarget
  name: Update Target
  type: LOOKUP
  bits: 8
  lookup: FUSION_UPDATE_TARGET
  description: Update destination, not a firmware-container component identifier. Other values are model-dependent.
  specialValues: 0
- id: updateState
  name: Update State
  type: LOOKUP
  bits: 8
  lookup: FUSION_UPDATE_STATE
  specialValues: 0
- id: progress
  name: Progress
  type: UINT8
  description: Nominal percentage/staged progress indicator. Remote and DAB transfer paths compute percentages;
    main-radio paths also use staged increments. Completion uses 100. Not a guarantee of bytes transferred
    or successful later boot.
notes: |-
  Reports firmware-update target, state and progress following PGN 126720
  command 0x0010. Captures show targets 1 (main radio), 2 (remote) and 7
  (DAB module), and states 1 (In Progress), 2 (Completed) and 3 (Failed).
  The remote-update capture includes progress 0, 48 and 100, ending with
  Completed; the DAB capture includes In Progress and Failed at progress 0.

  Progress is a nominal percentage or staged indicator, not a guaranteed
  fraction of image bytes transferred. A Completed report does not prove
  that subsequent installation or boot succeeded. There is no transaction
  token, and repeated status messages are not necessarily separate replies.
  Unknown target and state values remain numeric, without assumed sentinels;
  additional model-specific meanings have not been established.

  Evidence: samples/fusion-firmware-update.raw, from the same MS-NRX300 /
  MS-RA70N sessions as the corresponding Update Firmware commands.
