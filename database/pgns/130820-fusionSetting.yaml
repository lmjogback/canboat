pgn: 130820
id: fusionSetting
description: 'Fusion: Setting'
type: Fast
variantOrder: 29
priority: 7
fields:
- id: manufacturerCode
  name: Manufacturer Code
  type: LOOKUP
  bits: 11
  description: Fusion Electronics
  match: 419
  lookup: MANUFACTURER_CODE
- id: reserved
  name: Reserved
  type: RESERVED
  bits: 2
- id: industryCode
  name: Industry Code
  type: LOOKUP
  bits: 3
  description: Marine Industry
  match: 4
  lookup: INDUSTRY_CODE
- id: messageId
  name: Message ID
  type: LOOKUP
  bits: 16
  description: Setting
  match: 32788
  lookup: FUSION_STATUS_MESSAGE_ID
  primaryKey: true
- id: id
  name: ID
  type: LOOKUP
  bits: 32
  lookup: FUSION_SETTING
- id: value
  name: Value
  type: INDIRECT_LOOKUP
  bits: 32
  lookupIndirect:
    name: FUSION_SETTING_VALUE
    order: 5
notes: |-
  `value` is an INDIRECT_LOOKUP keyed on the `id` field, so a setting whose
  values form a closed set decodes to a name. FUSION_SETTING 2 "Zone 2 Linked",
  11 "iPod Album Artwork", and 64 "AM Enabled" use Off/On values. Setting 6
  "Telemute" selects the action on input activation: 0 = Mute, 1 = switch to
  AUX1; this is a configuration value, not the current input state.
  Setting 7 "Tuner Region" uses a region enumeration. Values without
  an indirect lookup entry continue to decode as plain numbers, which is what
  the preset frequencies and volume levels need.

  Not every setting belongs in the enumeration. Id 74 "Volume Zone Sync" is
  deliberately left out: its value is a zero-based ZONE INDEX with a sentinel
  (observed 0 and 1 selecting a zone, 4 meaning All), so the meaningful values
  depend on how many zones the unit has rather than forming a fixed list.

  AM preset IDs 14 through 28 and FM preset IDs 29 through 43 use value as
  the stored preset frequency in Hz. A value of zero indicates an empty
  preset.

  This message is observed as the immediate status update after changing
  or clearing a tuner preset with Fusion: Set Setting on PGN 126720.

  Evidence: samples/fusion-setting-values.raw contains observed
  MS-RA70N/MS-NRX300 Set Setting / Setting exchanges for Zone 2 Linked
  Off/On and Telemute Mute/AUX1 actions. The iPod Album Artwork and AM Enabled
  mappings are supported by controlled Set Setting command captures in that
  file; no matching singular Setting status is claimed for those captures.
  samples/fusion-tuner-presets.raw contains the tuner preset evidence.

