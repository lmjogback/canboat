pgn: 126720
id: fusionSetSetting
description: 'Fusion: Set Setting'
type: Fast
variantOrder: 57
fields:
- id: manufacturerCode
  name: Manufacturer Code
  type: LOOKUP
  bits: 11
  description: Fusion Electronics
  match: 419
  lookup: MANUFACTURER_CODE
- id: reserved
  name: Reserved
  type: RESERVED
  bits: 2
- id: industryCode
  name: Industry Code
  type: LOOKUP
  bits: 3
  description: Marine Industry
  match: 4
  lookup: INDUSTRY_CODE
- id: proprietaryId
  name: Proprietary ID
  type: LOOKUP
  bits: 16
  description: Set Settings
  match: 15
  lookup: FUSION_MESSAGE_ID
  primaryKey: true
- id: id
  name: ID
  type: LOOKUP
  bits: 32
  lookup: FUSION_SETTING
- id: value
  name: Value
  type: INDIRECT_LOOKUP
  bits: 32
  lookupIndirect:
    name: FUSION_SETTING_VALUE
    order: 5
notes: |-
  The write counterpart to the Fusion: Setting / Fusion: Settings status
  messages on PGN 130820: same (ID, Value) pair, same FUSION_SETTING
  enumeration. FUSION_MESSAGE_ID has carried 15 = Set Settings all along
  with no variant behind it.

  Despite the plural name the payload carries exactly one pair and has no
  Count field. A leading Count would have consumed the first word, leaving
  the unit to read ID 0 (Alpha Search Threshold); it instead changed setting
  2, which only fits the layout above.

  Setting 2 "Zone 2 Linked" uses Off/On values, both observed in
  MS-RA70N/MS-NRX300 command and status exchanges. Setting 6 "Telemute"
  selects the action when the Telemute input is activated: 0 = Mute,
  1 = switch to AUX1. It does not report whether the input is active.
  Both action values are observed in the same device setup.
  Settings 11 "iPod Album Artwork" and 64 "AM Enabled" also use Off/On; both
  values are observed in controlled on/off Set Setting command captures.

  AM preset IDs 14 through 28 and FM preset IDs 29 through 43 use value as
  the preset frequency in Hz. Setting value to zero clears the preset.

  On an MS-RA70N/MS-NRX300, "Delete All" was observed as one Set Setting
  message per preset in the selected AM or FM bank, with value set to zero.

  Evidence: samples/fusion-set-setting-zone-link.raw contains two generic setting
  writes injected onto the bus from canboat at address 200, each answered
  ~20 ms later by a Fusion MS-WB670 echoing the same id and value as a 130820
  status message, with both changes taking effect on the unit.

  samples/fusion-setting-values.raw contains the observed Zone 2 Linked
  Off/On and Telemute Mute/AUX1 exchanges plus controlled iPod Album Artwork
  and AM Enabled Set Setting on/off commands. samples/fusion-tuner-presets.raw
  contains the AM/FM preset set and clear operations observed on an
  MS-RA70N/MS-NRX300.
