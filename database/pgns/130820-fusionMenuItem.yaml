notes: |-
  Menu Item flag bit 1 (0x02), Selected, is set for the selected Bluetooth
  device and while Discoverable is enabled. Bit 3 (0x08), Translated,
  requests localization of the text by the client; it does not mean the
  received text is already translated. Bit 6 (0x40), Submenu, identifies
  a submenu item. Bit 7 (0x80), Tick Item, selects an item presentation
  whose checked state is determined by Selected; it does not specify a
  toggle command.

  The Android 13.0.0 client and NRX300 1.02.78 give Submenu presentation
  precedence over Tick Item. NRX localization also depends on its local
  translation setting. Bits 0, 2, 4 and 5 remain unnamed.

  lockId is the menu lock ID allocated by PGN 130820 message id 32786 "Menu
  Lock ID" in reply to PGN 126720 proprietary id 12 "Request Menu Lock ID"; see
  those for how it is obtained and used.

  Evidence: samples/fusion-ra70n-menu-operations.raw,
  samples/fusion-ms-ra70n-bluetooth-menu.raw and the existing
  samples/boatkit-fusion-menu.raw.
  Firmware/client correlation:
  https://github.com/lmjogback/signalk-work/blob/c115b564b594571389760a0414ab5480ef0fd8d0/projects/fusion/firmware-research/findings/MENU-FLAG-CORRELATION-20260924.md
