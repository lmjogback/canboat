notes: |-
  Requests a factory reset of the addressed stereo. The captured MS-NRX300
  command to an MS-RA70N has a four-byte reassembled payload: the two-byte
  manufacturer/industry prefix followed by command 0x0021, little-endian.
  There are no additional command parameters. Fast-packet framing and CAN
  padding are not part of the command payload.

  The request alone does not establish the exact settings reset or successful
  completion. No dedicated acknowledgement is identified by this definition;
  subsequent ordinary status messages must not be treated as proof of one.
  This command is distinct from Sirius Factory Reset (0x0026).

  Evidence: samples/fusion-factory-reset.raw, from
  fusion-nrx300-update-factoryreset.log, line 126 (2026-09-19).
